name: Publish firewall consumer image

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish once, or verify public access after package visibility changes
        required: true
        type: choice
        options:
          - publish
          - verify-public
        default: publish
      expected_digest:
        description: Required for verify-public; copy the pushed digest from the publish run
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-firewall-consumer
  cancel-in-progress: false

env:
  SOURCE_SHA: f76100c298c96a3a6fa4eeb1fbbcceb06dfe234e
  IMAGE: ghcr.io/ctrl-alt-keith/linode-image-lab/firewall-consumer
  TAG: sha-f76100c298c96a3a6fa4eeb1fbbcceb06dfe234e

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out approved source commit
        if: inputs.mode == 'publish'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source and run canonical checks
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          make check

      - name: Build and smoke-test Linux amd64 image
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$TAG" .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE:$TAG")" = linux/amd64
          docker run --rm --platform linux/amd64 "$IMAGE:$TAG" firewall-sync --help >/dev/null

      - name: Log in with repository-scoped GitHub token
        if: inputs.mode == 'publish'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Refuse an existing or unverifiable tag
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>tag-inspect-error; then
            echo "Refusing to overwrite existing $IMAGE:$TAG" >&2
            exit 1
          fi
          if ! grep -Eiq 'manifest unknown|name unknown' tag-inspect-error; then
            echo 'Could not prove that the GHCR tag is absent; refusing to publish.' >&2
            cat tag-inspect-error >&2
            exit 1
          fi

      - name: Push and record immutable source and workflow identities
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG" | tee push.log
          digest="$(sed -nE 's/^.*digest: (sha256:[[:xdigit:]]{64}).*$/\1/p' push.log | tail -n 1)"
          test -n "$digest"
          echo "PUSHED_DIGEST=$digest" >> "$GITHUB_ENV"
          {
            echo '### Firewall consumer image'
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Workflow commit: \`$GITHUB_WORKFLOW_SHA\`"
            echo "- Workflow ref: \`$GITHUB_WORKFLOW_REF\`"
            echo "- Builder: \`$RUNNER_OS/$RUNNER_ARCH\`, Docker \`$(docker version --format '{{.Server.Version}}')\`"
            echo "- Run: \`$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT\`"
            echo "- Pushed reference: \`$IMAGE@$digest\`"
            echo '- If this first publication is private, set the package public in GitHub package settings, then run verify-public with this digest.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify anonymous pull resolves the pushed digest
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_MODE" == publish ]]; then
            expected_digest="$PUSHED_DIGEST"
            docker logout ghcr.io
            docker image rm "$IMAGE:$TAG"
          else
            expected_digest="$REQUESTED_DIGEST"
          fi
          if [[ ! "$expected_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'An exact pushed sha256 manifest digest is required.' >&2
            exit 1
          fi
          docker pull --platform linux/amd64 "$IMAGE:$TAG" | tee pull.log
          pulled_digest="$(sed -nE 's/^Digest: (sha256:[[:xdigit:]]{64})$/\1/p' pull.log | tail -n 1)"
          test -n "$pulled_digest"
          test "$pulled_digest" = "$expected_digest"
          echo "- Anonymous tag pull: verified \`$IMAGE@$pulled_digest\`" >> "$GITHUB_STEP_SUMMARY"
