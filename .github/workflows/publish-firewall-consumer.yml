name: Publish firewall consumer image

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish once, verify public access, or verify the private image
        required: true
        type: choice
        options:
          - publish
          - verify-public
          - verify-private
        default: publish
      expected_digest:
        description: Digest for verification modes; unused for publish
        required: false
        type: string

permissions: {}

concurrency:
  group: publish-firewall-consumer
  cancel-in-progress: false

env:
  SOURCE_SHA: 0b6676da09eba2ed11d12fc91aa30b343f665a3c
  IMAGE: ghcr.io/ctrl-alt-keith/linode-image-lab/firewall-consumer
  TAG: sha-0b6676da09eba2ed11d12fc91aa30b343f665a3c

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: e8922349349e0236301f4a3ea115d66ce6dbbce4
      TAG: sha-e8922349349e0236301f4a3ea115d66ce6dbbce4
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish_image.outputs.digest }}
      source_sha: ${{ steps.publish_image.outputs.source_sha }}
    steps:
      - name: Check out approved source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source and run canonical checks
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ctrl-alt-keith/linode-image-lab
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$TAG" = "sha-$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          make check

      - name: Build and smoke-test Linux amd64 image
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$TAG" .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE:$TAG")" = linux/amd64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE:$TAG")" = "$SOURCE_SHA"
          docker run --rm --platform linux/amd64 "$IMAGE:$TAG" firewall-sync --help >/dev/null
          docker run --rm --platform linux/amd64 "$IMAGE:$TAG" service-acl-sync --help >/dev/null
          acl_help="$(docker run --rm --pull never --platform linux/amd64 --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges "$IMAGE:$TAG" acl-sync --help)"
          for flag in reconcile-from-stdin rollback-from-stdin registry-version-file acl-receipt-dir; do
            grep -Eq -- "^[[:space:]]*--${flag}([[:space:]]|$)" <<< "$acl_help"
          done

      - name: Log in with repository-scoped GitHub token
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Refuse existing package or tag before push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package_api='https://api.github.com/orgs/ctrl-alt-keith/packages/container/linode-image-lab%2Ffirewall-consumer'
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$package_api")"
          if [[ "$status" != 200 ]]; then
            echo "Cannot verify existing package and tag inventory (HTTP $status)" >&2
            exit 1
          fi
          tags="$(gh api --paginate \
            'orgs/ctrl-alt-keith/packages/container/linode-image-lab%2Ffirewall-consumer/versions?per_page=100' \
            --jq '.[] | .metadata.container.tags[]?')"
          visibility="$(gh api \
            'orgs/ctrl-alt-keith/packages/container/linode-image-lab%2Ffirewall-consumer' \
            --jq .visibility)"
          if [[ "$visibility" != private ]]; then
            echo 'The existing package must be private.' >&2
            exit 1
          fi
          if grep -Fxq "$TAG" <<< "$tags"; then
            echo "Refusing to overwrite existing $IMAGE:$TAG" >&2
            exit 1
          fi
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>tag-inspect-error; then
            echo "Refusing to overwrite existing manifest $IMAGE:$TAG" >&2
            exit 1
          fi
          lookup_error="$(cat tag-inspect-error)"
          allowed=false
          if [[ "$lookup_error" == 'manifest unknown' || "$lookup_error" == 'name unknown' ]]; then
            allowed=true
          fi
          if [[ "$allowed" != true ]]; then
            echo 'Registry lookup had an unexpected authentication or transport failure.' >&2
            cat tag-inspect-error >&2
            exit 1
          fi
          echo "Package API HTTP $status; registry lookup: $lookup_error"

      - name: Push and record immutable source and workflow identities
        id: publish_image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG" | tee push.log
          digest="$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' push.log | tail -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### Firewall consumer image'
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Workflow commit: \`$GITHUB_WORKFLOW_SHA\`"
            echo "- Workflow ref: \`$GITHUB_WORKFLOW_REF\`"
            echo "- Builder: \`$RUNNER_OS/$RUNNER_ARCH\`, Docker \`$(docker version --format '{{.Server.Version}}')\`"
            echo "- Run: \`$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT\`"
            echo "- Pushed reference: \`$IMAGE@$digest\`"
            echo '- No package visibility setting was changed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          docker manifest inspect "$IMAGE@$digest" >/dev/null
          docker pull --platform linux/amd64 "$IMAGE:$TAG" | tee pull.log
          pulled_digest="$(sed -nE 's/^Digest: (sha256:[0-9a-f]{64})$/\1/p' pull.log | tail -n 1)"
          test "$pulled_digest" = "$digest"
          echo '- Pushed digest is readable and the tag resolves to it.' >> "$GITHUB_STEP_SUMMARY"
          visibility_after="$(gh api \
            'orgs/ctrl-alt-keith/packages/container/linode-image-lab%2Ffirewall-consumer' \
            --jq .visibility)"
          if [[ "$visibility_after" != private ]]; then
            echo 'Package is no longer private after publication.' >&2
            exit 1
          fi
          echo '- Package visibility preserved: `private`' >> "$GITHUB_STEP_SUMMARY"
          printf 'digest=%s\nsource_sha=%s\n' "$digest" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  verify-published:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    env:
      PUBLISHED_DIGEST: ${{ needs.publish.outputs.digest }}
      SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
    steps:
      - name: Pull and verify this run's private image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ctrl-alt-keith/linode-image-lab
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(uname -m)" = x86_64
          [[ "$PUBLISHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          reference="$IMAGE@$PUBLISHED_DIGEST"
          if docker image inspect "$reference" >/dev/null 2>&1; then
            echo 'Refusing verification with a locally cached image.' >&2
            exit 1
          fi
          auth_config="$(mktemp -d "$RUNNER_TEMP/ghcr-consumer-published.XXXXXX")"
          trap 'rm -rf "$auth_config"' EXIT
          printf '%s' "$GHCR_TOKEN" | DOCKER_CONFIG="$auth_config" docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          pull_output="$(DOCKER_CONFIG="$auth_config" docker pull --platform linux/amd64 "$reference")"
          pulled_digest="$(sed -nE 's/^Digest: (sha256:[0-9a-f]{64})$/\1/p' <<< "$pull_output" | tail -n 1)"
          test "$pulled_digest" = "$PUBLISHED_DIGEST"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$reference")" = linux/amd64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$reference")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$reference")" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          help_output="$(docker run --rm --pull never --platform linux/amd64 --network none \
            --read-only --cap-drop ALL --security-opt no-new-privileges "$reference" acl-reconcile-wans --help)"
          grep -Eq -- '^[[:space:]]*--execute-after-verified-cutover([[:space:]]|$)' <<< "$help_output"
          {
            echo '### Published WAN ACL image verification'
            echo "- Digest: \`$reference\`"
            echo "- Source revision: \`$SOURCE_SHA\`"
            echo '- Linux amd64 entry-point help verified offline without container credentials.'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-public:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'verify-public'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Pull the exact published tag anonymously on a fresh runner
        shell: bash
        env:
          IMAGE: ghcr.io/ctrl-alt-keith/linode-image-lab/firewall-consumer
          REQUESTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ctrl-alt-keith/linode-image-lab
          test "$(uname -m)" = x86_64
          expected_digest="$REQUESTED_DIGEST"
          [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          anonymous_config="$(mktemp -d "$RUNNER_TEMP/ghcr-consumer-anonymous.XXXXXX")"
          if DOCKER_CONFIG="$anonymous_config" docker image inspect "$IMAGE@$expected_digest" >/dev/null 2>&1; then
            echo 'Refusing verification with a locally cached image.' >&2
            exit 1
          fi
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$IMAGE@$expected_digest" >/dev/null
          DOCKER_CONFIG="$anonymous_config" docker pull --platform linux/amd64 "$IMAGE:$TAG" | tee pull.log
          pulled_digest="$(sed -nE 's/^Digest: (sha256:[0-9a-f]{64})$/\1/p' pull.log | tail -n 1)"
          test "$pulled_digest" = "$expected_digest"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE:$TAG")" = linux/amd64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE:$TAG")" = "$SOURCE_SHA"
          {
            echo "Anonymous tag: $IMAGE:$TAG"
            echo "Verified digest: $IMAGE@$expected_digest"
            echo "Workflow commit: $GITHUB_SHA"
            echo "Verification run: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-private:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'verify-private'
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    env:
      EXPECTED_DIGEST: sha256:b69b72d39911cffd2044ba165f2bd033b9eb36097fe0fd64856423e847325b87
      REQUESTED_DIGEST: ${{ inputs.expected_digest }}
    steps:
      - name: Pull exact private digest with job-scoped package read
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ctrl-alt-keith/linode-image-lab
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(uname -m)" = x86_64
          [[ "$REQUESTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$REQUESTED_DIGEST" = "$EXPECTED_DIGEST"
          if docker image inspect "$IMAGE@$EXPECTED_DIGEST" >/dev/null 2>&1; then
            echo 'Refusing verification with a locally cached image.' >&2
            exit 1
          fi
          auth_config="$(mktemp -d "$RUNNER_TEMP/ghcr-consumer-private.XXXXXX")"
          trap 'rm -rf "$auth_config"' EXIT
          printf '%s' "$GHCR_TOKEN" | DOCKER_CONFIG="$auth_config" docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          DOCKER_CONFIG="$auth_config" docker manifest inspect "$IMAGE@$EXPECTED_DIGEST" >/dev/null
          DOCKER_CONFIG="$auth_config" docker pull --platform linux/amd64 "$IMAGE@$EXPECTED_DIGEST" >/dev/null

      - name: Check exact image revision and firewall flag offline
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE@$EXPECTED_DIGEST")" = linux/amd64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$EXPECTED_DIGEST")" = "$SOURCE_SHA"
          help_output="$(docker run --rm --pull never --platform linux/amd64 --network none --read-only --cap-drop ALL --security-opt no-new-privileges "$IMAGE@$EXPECTED_DIGEST" firewall-sync --help)"
          grep -Eq -- '^[[:space:]]*--registry-version-file[[:space:]]+' <<< "$help_output"
          {
            echo '### Private firewall consumer image verification'
            echo "- Digest: \`$IMAGE@$EXPECTED_DIGEST\`"
            echo "- Source revision: \`$SOURCE_SHA\`"
            echo '- Platform: `linux/amd64`'
            echo '- `firewall-sync --help` exposes `--registry-version-file`.'
            echo '- Help ran with networking disabled and no credentials passed to the container.'
          } >> "$GITHUB_STEP_SUMMARY"
